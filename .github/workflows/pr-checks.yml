name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  commit-format:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit messages are Conventional Commits
        run: |
          set -e
          PATTERN='^(feat|fix|build|chore|ci|docs|style|refactor|perf|test)(\([a-z0-9./_-]+\))?!?: .+'
          FAILED=0
          while IFS= read -r sha; do
            MSG=$(git log -1 --format=%s "$sha")
            if ! echo "$MSG" | grep -qE "$PATTERN"; then
              echo "::error::Commit $sha does not follow Conventional Commits: \"$MSG\""
              FAILED=1
            fi
          done < <(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD")
          exit $FAILED

  lint:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - run: pip install uv==0.12.5

      - name: Lint changed files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -n "$FILES" ]; then
            uvx ruff check $FILES
          else
            echo "No changed Python files to lint."
          fi

  test:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - run: pip install uv==0.12.5

      - run: uv pip install --system ".[dev]"

      - run: pytest tests
